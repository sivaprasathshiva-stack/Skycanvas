name: skycanvas_remote
description: SkyCanvas Remote Control - Control your SkyCanvas projection from your phone
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2

  # Network
  web_socket_channel: ^3.0.1
  network_info_plus: ^6.0.2
  multicast_dns: ^0.3.2+7

  # UI
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
