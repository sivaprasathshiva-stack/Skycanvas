name: skycanvas_mobile
description: A standalone mobile planetarium app showing real-time stars, planets, and constellations
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6

  # Location & Sensors
  geolocator: ^14.0.0
  geocoding: ^4.0.0
  flutter_compass: ^0.8.0
  sensors_plus: ^7.0.0

  # State Management
  provider: ^6.1.2

  # Data & Storage
  sqflite: ^2.3.2
  shared_preferences: ^2.3.0
  path_provider: ^2.1.3

  # Astronomy Calculations
  vector_math: ^2.1.4

  # Date/Time
  intl: ^0.20.0

  # Notifications
  flutter_local_notifications: ^18.0.0

  # Permissions
  permission_handler: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
